# OKLENT BUSINESS web tier — PRODUCTION site (SEC-05): HTTP only redirects to HTTPS; everything is served over TLS.
# Certificates are mounted read-only from ./deploy/certs (fullchain.pem + privkey.pem, e.g. issued by Let's Encrypt/certbot or your CA).
include /etc/nginx/erpx-common.conf;

server {                                                               # plain HTTP: ACME challenge only, everything else -> HTTPS
  listen 80 default_server;
  server_name _;
  server_tokens off;
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;
  server_tokens off;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:erpx_ssl:10m;
  ssl_session_tickets off;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  client_max_body_size 1m;
  include /etc/nginx/erpx-locations.conf;
}
