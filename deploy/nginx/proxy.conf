# Shared proxy settings for the api upstream. X-Forwarded-For is OVERWRITTEN (not appended) so a client cannot spoof its address,
# which is what the API's login throttle keys on (TRUST_PROXY=true is set only for the compose api service).
proxy_pass http://erpx_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
