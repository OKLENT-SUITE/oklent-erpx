# PRODUCTION stack (SEC-04 / SEC-05). Usage:  node api/src/config-check-cli.js .env && docker compose -f docker-compose.prod.yml up -d --build
# Differences from docker-compose.yml: every secret is REQUIRED (no defaults), NODE_ENV=production, the database port is NOT published,
# nginx serves HTTPS on 443 (HTTP 80 only redirects), certificates come from ./deploy/certs (fullchain.pem, privkey.pem).
name: oklent-erpx-prod
services:
  db:
    image: postgres:16.10
    environment:
      POSTGRES_USER: erpx_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD in .env}
      POSTGRES_DB: erpx
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    volumes:
      - erpx_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck: { test: ["CMD-SHELL","pg_isready -U erpx_owner -d erpx"], interval: 5s, retries: 20 }
    restart: unless-stopped
  migrate:
    build: .
    command: ["node", "api/src/migrate-cli.js"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      OWNER_DATABASE_URL: postgres://erpx_owner:${OWNER_DB_PASSWORD:?}@db:5432/erpx
      MULTI_TENANT: ${MULTI_TENANT:-0}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-default}
    restart: "no"
  # Company administration (needs the OWNER credential, so it is never part of the running stack):
  #   docker compose -f docker-compose.prod.yml --profile admin run --rm tenant-admin create --slug acme --name "شركة أكمي"
  tenant-admin:
    build: .
    profiles: ["admin"]
    entrypoint: ["node", "api/src/tenant-cli.js"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      OWNER_DATABASE_URL: postgres://erpx_owner:${OWNER_DB_PASSWORD:?}@db:5432/erpx
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-default}
    restart: "no"
  api:
    build: .
    depends_on: { db: { condition: service_healthy }, migrate: { condition: service_completed_successfully } }
    environment:
      DATABASE_URL: postgres://erpx_app:${APP_DB_PASSWORD:?}@db:5432/erpx
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      NODE_ENV: production
      MULTI_TENANT: ${MULTI_TENANT:-0}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
      TENANT_REQUIRE_EXPLICIT: ${TENANT_REQUIRE_EXPLICIT:-}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY:-}
      ZATCA_ENABLED: ${ZATCA_ENABLED:-0}
      ZATCA_ENV: ${ZATCA_ENV:-sandbox}
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: "true"
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-6000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-600}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-0}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-0}
      AI_INPUT_USD_PER_1M: ${AI_INPUT_USD_PER_1M:-0}
      AI_OUTPUT_USD_PER_1M: ${AI_OUTPUT_USD_PER_1M:-0}
    volumes: [ "erpx_uploads:/app/uploads" ]
    expose: ["3100"]
    healthcheck: { test: ["CMD-SHELL","wget -qO- http://127.0.0.1:3100/api/readyz >/dev/null || exit 1"], interval: 5s, timeout: 3s, retries: 20, start_period: 5s }
    restart: unless-stopped
  web:
    image: nginx:1.27-alpine
    depends_on: { api: { condition: service_healthy } }
    environment: { ERPX_WEB_CONF: "1.3.1-tls" }
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/erpx-common.conf:/etc/nginx/erpx-common.conf:ro
      - ./deploy/nginx/erpx-locations.conf:/etc/nginx/erpx-locations.conf:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/erpx-proxy.conf:ro
      - ./deploy/nginx/security-headers.conf:/etc/nginx/erpx-security-headers.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports: ["80:80", "443:443"]
    restart: unless-stopped
volumes:
  erpx_pgdata:
  erpx_uploads:
