# Server-level part shared by the HTTP (dev) and HTTPS (production) sites: API proxy rules, static shell, caching, hidden files.
  # --- API and storefront pages (the API sets its own security + Cache-Control headers) ---
  location = /api/auth/login {
    limit_req zone=erpx_login burst=20 nodelay;
    include /etc/nginx/erpx-proxy.conf;
  }
  location ~ ^/api/products/[0-9]+/image$ {                            # image upload: the only place allowed a body larger than 1m (API caps it at 2 MB)
    client_max_body_size 3m;
    limit_req zone=erpx_api burst=20 nodelay;
    include /etc/nginx/erpx-proxy.conf;
  }
  location ~ ^/api/public/(bookings|orders)$ {                          # SEC-03: anonymous writes: 10 req/min/IP, burst 5, small body
    client_max_body_size 64k;
    limit_req zone=erpx_pubpost burst=5 nodelay;
    include /etc/nginx/erpx-proxy.conf;
  }
  location /api/public/ {                                              # SEC-03: anonymous reads (catalogue, geography)
    limit_req zone=erpx_public burst=30 nodelay;
    include /etc/nginx/erpx-proxy.conf;
  }
  location /api/ {
    limit_req zone=erpx_api burst=100 nodelay;
    include /etc/nginx/erpx-proxy.conf;
  }
  location /uploads/ { include /etc/nginx/erpx-proxy.conf; }          # product images are served by the api from the persistent volume
  location /shop/ { include /etc/nginx/erpx-proxy.conf; }

  # --- the shell that must never be served stale: index.html and the service worker ---
  location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/erpx-security-headers.conf;
    try_files /index.html =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/erpx-security-headers.conf;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/erpx-security-headers.conf;
  }

  location = /manifest.webmanifest {                                   # correct MIME type on every nginx build (older mime.types lack it)
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/erpx-security-headers.conf;
  }

  # --- hidden files are never served, except /.well-known (Digital Asset Links for Google Play) ---
  location ~ /\.(?!well-known) { deny all; return 404; }

  # --- everything else in web/: always revalidate (ETag), so an upgrade never leaves stale JavaScript ---
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/erpx-security-headers.conf;
    try_files $uri =404;
  }
