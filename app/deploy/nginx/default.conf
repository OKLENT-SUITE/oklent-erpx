# OKLENT BUSINESS web tier (nginx) — DEVELOPMENT / LAN site over plain HTTP: serves web/ and forwards /api and /shop to the api container.
# Public port stays 3100 (docker-compose maps 3100 -> 80) so the URL never changes. https://oklent.net/
# PRODUCTION must use tls.conf (HTTPS + redirect) — see docs/DEPLOYMENT.md and docker-compose.prod.yml.
include /etc/nginx/erpx-common.conf;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  client_max_body_size 1m;                                             # same as the API bodyLimit
  include /etc/nginx/erpx-locations.conf;
}
