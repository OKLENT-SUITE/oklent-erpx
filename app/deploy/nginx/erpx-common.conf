# OKLENT BUSINESS web tier — http-level part shared by the plain-HTTP (dev) and the TLS (production) site: rate-limit zones + api upstream.
# These zones live in nginx, i.e. in ONE shared place in front of any number of api replicas (the api's own in-memory counters are per-process).

limit_req_zone $binary_remote_addr zone=erpx_login:10m rate=60r/m;     # brute-force guard on sign-in (the API adds its own per-user lockout)
limit_req_zone $binary_remote_addr zone=erpx_api:10m   rate=50r/s;
limit_req_zone $binary_remote_addr zone=erpx_public:10m  rate=30r/m;     # SEC-03: anonymous catalogue / geography reads
limit_req_zone $binary_remote_addr zone=erpx_pubpost:10m rate=10r/m;     # SEC-03: anonymous bookings and orders (the API adds 10 bookings / 10 min / IP on its own)
limit_req_status 429;

upstream erpx_api { server api:3100; keepalive 16; }

